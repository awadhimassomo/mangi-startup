<style>
.zoomable { cursor:zoom-in; }
.lb-overlay { display:none; position:fixed; inset:0; z-index:10000; background:rgba(0,0,0,.92); overflow:auto; -webkit-overflow-scrolling:touch; }
.lb-overlay.show { display:block; }
.lb-overlay img { display:block; margin:0 auto; max-width:100%; max-height:100vh; object-fit:contain; cursor:zoom-in; touch-action:pinch-zoom pan-x pan-y; }
.lb-overlay.full img { max-width:none; max-height:none; width:auto; cursor:zoom-out; }
.lb-close { position:fixed; top:10px; right:14px; z-index:10001; width:42px; height:42px; border:none; border-radius:50%; background:#fff; font-size:1.4rem; cursor:pointer; }
.lb-hint { position:fixed; bottom:12px; left:0; right:0; text-align:center; color:#fff; font-size:0.8rem; opacity:.75; pointer-events:none; }
</style>
<div class="lb-overlay" id="lb"><button type="button" class="lb-close" aria-label="Close">&times;</button><img alt=""><div class="lb-hint">Tap the image to zoom · Esc or × to close</div></div>
<script>
(function () {
    var lb = document.getElementById("lb"), big = lb.querySelector("img");
    function open(src) { big.src = src; lb.classList.remove("full"); lb.classList.add("show"); lb.scrollTop = 0; }
    function close() { lb.classList.remove("show", "full"); big.removeAttribute("src"); }
    lb.querySelector(".lb-close").addEventListener("click", close);
    big.addEventListener("click", function (e) { e.stopPropagation(); lb.classList.toggle("full"); });
    lb.addEventListener("click", function (e) { if (e.target === lb) close(); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
    document.querySelectorAll("img.zoomable").forEach(function (img) {
        img.title = "Double-click to read the poster";
        img.addEventListener("dblclick", function (e) { e.preventDefault(); e.stopPropagation(); open(img.currentSrc || img.src); });
        var link = img.closest("a");
        if (link) {   // single click still opens the page, but wait a moment in case it's a double-click
            var timer = null;
            link.addEventListener("click", function (e) {
                e.preventDefault();
                if (timer) { clearTimeout(timer); timer = null; open(img.currentSrc || img.src); return; }
                timer = setTimeout(function () { timer = null; window.location.href = link.href; }, 280);
            });
        }
    });
})();
</script>
